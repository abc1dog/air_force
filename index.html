<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- 문서 문자 인코딩 설정 -->
  <meta charset="UTF-8">
  <!-- 스마트폰 및 다양한 화면 크기에 대응하기 위한 뷰포트 설정 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 웹페이지 탭 제목 -->
  <title>실시간 대기오염 정보</title>
  <!-- 외부에 분리된 CSS 스타일시트 파일 연결 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 전체 화면을 감싸는 중앙 정렬 컨테이너 -->
  <div class="container">
    <!-- 페이지 상단 헤더 영역 -->
    <header class="header">
      <!-- 메인 서비스 제목 -->
      <h1>실시간 대기오염 정보</h1>
      <!-- 시도 지역 선택 컨트롤 영역 -->
      <div class="select-group">
        <!-- 드롭다운 안내 라벨 -->
        <label for="sidoSelect">지역 선택</label>
        <!-- 18개 시도 목록 드롭다운 -->
        <select id="sidoSelect">
          <option value="전국">전국</option>
          <option value="서울" selected>서울</option>
          <option value="부산">부산</option>
          <option value="대구">대구</option>
          <option value="인천">인천</option>
          <option value="광주">광주</option>
          <option value="대전">대전</option>
          <option value="울산">울산</option>
          <option value="세종">세종</option>
          <option value="경기">경기</option>
          <option value="강원">강원</option>
          <option value="충북">충북</option>
          <option value="충남">충남</option>
          <option value="전북">전북</option>
          <option value="전남">전남</option>
          <option value="경북">경북</option>
          <option value="경남">경남</option>
          <option value="제주">제주</option>
        </select>
      </div>
    </header>

    <!-- 선택된 지역의 평균 미세먼지를 강조 표시하는 섹션 -->
    <section class="average-section is-loading" id="averageSection" aria-live="polite">
      <h2 id="averageTitle">서울 대기 상태</h2>
      <div class="average-signal">
        <span class="average-emoji" id="averageEmoji" aria-hidden="true">⚪</span>
        <div class="average-copy">
          <div class="average-grade" id="averageGrade">불러오는 중...</div>
          <div class="average-value" id="averageValue"></div>
        </div>
      </div>
      <div class="average-status" id="averageStatus">불러오는 중...</div>
    </section>

    <!-- 측정소별 상세 카드 목록 섹션 -->
    <section class="stations-section">
      <h3>PM10 상위 10개 측정소</h3>
      <div class="chart-container" id="chartContainer">
        <canvas id="pm10Chart" aria-label="미세먼지 측정소별 PM10 상위 10개 가로 막대그래프" hidden></canvas>
        <p class="chart-message" id="chartMessage">불러오는 중...</p>
      </div>
      <!-- 섹션 소제목 -->
      <h3>측정소별 현황</h3>
      <!-- 동적으로 측정소 카드가 렌더링될 반응형 그리드 -->
      <div class="card-grid" id="cardGrid"></div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- 비동기 데이터 통신 및 렌더링을 담당하는 자바스크립트 연결 -->
  <script src="script.js"></script>
</body>
</html>
